buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["ReleaseProfiler_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

apply plugin: "com.android.library"
// AGP 9 ships built-in Kotlin (android.builtInKotlin) and registers the `kotlin`
// extension itself; applying kotlin-android on top fails with "Cannot add
// extension with name 'kotlin'". Only apply it when nothing registered it yet.
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ReleaseProfiler_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ReleaseProfiler_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (rootProject.ext.has("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }
  if (supportsNamespace()) {
    namespace "com.releaseprofiler"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  // ProfilingManager is a public API from Android 15; minSdk remains unchanged.
  compileSdkVersion Math.max(35, getExtOrIntegerDefault("compileSdkVersion"))

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    consumerProguardFiles "consumer-rules.pro"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
      }
    }

  }

  buildFeatures {
    prefab true
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  // Imported prefab libraries are supplied by the host React Native/Hermes AARs.
  // Package only this library's own bridge, avoiding duplicate or mismatched engines.
  packagingOptions {
    exclude "**/libjsi.so"
    exclude "**/libhermes.so"
    exclude "**/libhermesvm.so"
    exclude "**/libc++_shared.so"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  // The React Native Gradle plugin aligns this to the app's Hermes version.
  implementation "com.facebook.react:hermes-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}


// RN chooses Java 11 on older releases and Java 17 on current releases. Keep the
// Kotlin bytecode target aligned after the host plugin finalizes its Java settings.
// Works with both the Kotlin Gradle plugin and AGP 9 built-in Kotlin, where the
// android.kotlinOptions DSL no longer exists.
androidComponents.finalizeDsl { extension ->
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
    def target = extension.compileOptions.targetCompatibility.toString()
    if (task.hasProperty("compilerOptions")) {
      task.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(target))
    } else {
      task.kotlinOptions.jvmTarget = target
    }
  }
}
